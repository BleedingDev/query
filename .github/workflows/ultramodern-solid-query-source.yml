name: UltraModern Solid Query source

on:
  pull_request:
    paths:
      - 'packages/solid-query/**'
      - 'packages/query-devtools/**'
      - 'packages/query-persist-client-core/**'
      - 'packages/solid-query-devtools/**'
      - 'packages/solid-query-persist-client/**'
      - 'scripts/ultramodern-solid-query-*'
      - '.github/workflows/ultramodern-solid-query-source.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    branches: [solid-query-v6-pre]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful merged-branch push run containing the accepted archive
        required: true
        type: string

permissions: {}

concurrency:
  group: ultramodern-solid-query-source-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'BleedingDev/query' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test promotion guards
        run: node --test scripts/ultramodern-solid-query-release.test.mjs
      - name: Qualify source and strict installed consumer
        run: node scripts/ultramodern-solid-query-qualify.mjs "$RUNNER_TEMP/solid-query-accepted"
      - name: Preserve exact accepted merged-source archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/solid-query-v6-pre'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solid-query-source-${{ github.sha }}
          path: ${{ runner.temp }}/solid-query-accepted/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.repository == 'BleedingDev/query' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/solid-query-v6-pre'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test promotion guards
        run: node --test scripts/ultramodern-solid-query-release.test.mjs
      # Enable immutable releases with an authorized settings credential before
      # dispatch. GITHUB_TOKEN cannot inspect that Administration-scoped setting.
      - name: Publish exact archive accepted on merged source
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY_RELEASE_SETTINGS_TOKEN: ${{ secrets.QUERY_RELEASE_SETTINGS_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/ultramodern-solid-query-release.mjs "$CI_RUN_ID"
